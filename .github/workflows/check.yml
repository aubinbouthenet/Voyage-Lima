name: Suivi Vols Lima

on:
  schedule:
    - cron: '0 7 * * *' # Tous les jours à 7h00 UTC
  workflow_dispatch: # Permet de le lancer à la main

permissions:
  contents: write # Autorise le robot à sauvegarder le fichier

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Lancer le script de recherche
        run: python check.py
        
      - name: Sauvegarder le fichier prices.json
        run: |
          git config user.name "Robot Lima"
          git config user.email "robot@lima.com"
          git add prices.json
          git commit -m "Mise à jour des prix $(date +%F)" || echo "Aucun changement"
          git push
