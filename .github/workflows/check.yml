name: Suivi Vols Lima
on:
  schedule:
    - cron: '0 7 * * *' # Tous les jours à 7h00 UTC (9h à Paris)
  workflow_dispatch: # Permet de lancer le test à la main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Lancer le script de recherche
        run: python check.py
